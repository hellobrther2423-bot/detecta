services:
  - type: web
    name: detectoma-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: detectoma-db
          property: connectionString
      # Change this to your Vercel URL once deployed
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: detectoma-db
    databaseName: detectoma
    user: detectoma_user
